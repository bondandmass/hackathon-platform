# Local docker compose only: also proxies the API paths, standing in for the ALB.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    location = /health { return 200 'ok'; }
    location = / { try_files /index.html =404; }
    location /app/ { try_files $uri $uri/ /app/index.html; }

    location /teams       { proxy_pass http://team-service:8000; }
    location /submissions { proxy_pass http://submission-service:8000; }
    location /judging     { proxy_pass http://judging-service:8000; }
}
