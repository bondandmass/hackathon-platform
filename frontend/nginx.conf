# Production: the ALB sends /app (and /) here; the API paths go straight to the services.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://cognito-idp.ap-south-1.amazonaws.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # Public landing page. Its CSS and JS live under /app/ because the ALB only sends / (exact) and /app/* here.
    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /app {
        return 302 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
        expires -1;
    }
}
