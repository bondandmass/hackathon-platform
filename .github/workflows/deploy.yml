name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "588199412082"
  EKS_CLUSTER: hackathon-eks

  TEAM_ECR: 588199412082.dkr.ecr.ap-south-1.amazonaws.com/hackathon/team-service
  SUBMISSION_ECR: 588199412082.dkr.ecr.ap-south-1.amazonaws.com/hackathon/submission-service
  JUDGING_ECR: 588199412082.dkr.ecr.ap-south-1.amazonaws.com/hackathon/judging-service
  FRONTEND_ECR: 588199412082.dkr.ecr.ap-south-1.amazonaws.com/hackathon/frontend

jobs:
  deploy:
    name: Build and Deploy to EKS
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::588199412082:role/GitHubActionsHackathonRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      # Verify that AWS OIDC authentication worked
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Use GitHub commit SHA as immutable image tag
      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Team Service
      - name: Build and push team-service
        uses: docker/build-push-action@v6
        with:
          context: ./team-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.TEAM_ECR }}:${{ env.IMAGE_TAG }}
            ${{ env.TEAM_ECR }}:latest

      # Build and push Submission Service
      - name: Build and push submission-service
        uses: docker/build-push-action@v6
        with:
          context: ./submission-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.SUBMISSION_ECR }}:${{ env.IMAGE_TAG }}
            ${{ env.SUBMISSION_ECR }}:latest

      # Build and push Judging Service
      - name: Build and push judging-service
        uses: docker/build-push-action@v6
        with:
          context: ./judging-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.JUDGING_ECR }}:${{ env.IMAGE_TAG }}
            ${{ env.JUDGING_ECR }}:latest

      # Build and push the frontend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FRONTEND_ECR }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_ECR }}:latest

      # Configure kubectl for the EKS cluster
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      # Verify EKS access
      - name: Verify EKS access
        run: |
          kubectl get nodes

      # Apply application ConfigMap
      - name: Apply application configuration
        run: |
          kubectl apply -f k8s/configmap.yaml

      # Apply Team Service
      - name: Apply team-service
        run: |
          kubectl apply -f k8s/team-service.yaml

      # Apply Submission Service
      - name: Apply submission-service
        run: |
          kubectl apply -f k8s/submission-service.yaml

      # Apply Judging Service
      - name: Apply judging-service
        run: |
          kubectl apply -f k8s/judging-service.yaml
      - name: Apply frontend
        run: |
          kubectl apply -f k8s/frontend.yaml

      - name: Apply Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml

      - name: Apply HPA
        run: |
          kubectl apply -f k8s/hpa.yaml

      # Update Team Service to the exact commit image
      - name: Deploy team-service image
        run: |
          kubectl -n hackathon set image deployment/team-service \
            team-service=${TEAM_ECR}:${IMAGE_TAG}

      # Update Submission Service to the exact commit image
      - name: Deploy submission-service image
        run: |
          kubectl -n hackathon set image deployment/submission-service \
            submission-service=${SUBMISSION_ECR}:${IMAGE_TAG}

      # Update Judging Service to the exact commit image
      - name: Deploy judging-service image
        run: |
          kubectl -n hackathon set image deployment/judging-service \
            judging-service=${JUDGING_ECR}:${IMAGE_TAG}

      # Update the frontend to the exact commit image
      - name: Deploy frontend image
        run: |
          kubectl -n hackathon set image deployment/frontend \
            frontend=${FRONTEND_ECR}:${IMAGE_TAG}

      # Wait for Team Service rollout
      - name: Wait for team-service
        run: |
          kubectl -n hackathon rollout status \
            deployment/team-service \
            --timeout=180s

      # Wait for Submission Service rollout
      - name: Wait for submission-service
        run: |
          kubectl -n hackathon rollout status \
            deployment/submission-service \
            --timeout=180s

      # Wait for Judging Service rollout
      - name: Wait for Judging Service
        run: |
          kubectl -n hackathon rollout status \
            deployment/judging-service \
            --timeout=180s

      # Wait for frontend rollout
      - name: Wait for frontend
        run: |
          kubectl -n hackathon rollout status \
            deployment/frontend \
            --timeout=180s

      # Show final deployment status
      - name: Show deployment status
        run: |
          echo "===== DEPLOYMENTS ====="
          kubectl -n hackathon get deployments -o wide

          echo "===== PODS ====="
          kubectl -n hackathon get pods -o wide

          echo "===== SERVICES ====="
          kubectl -n hackathon get services
