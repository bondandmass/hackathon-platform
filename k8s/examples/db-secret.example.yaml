# NOT applied by `kubectl apply -f k8s/` (subfolders are skipped).
# Create the real secret once, from the command line, so the password never lands in Git:
#   kubectl create secret generic hackathon-db -n hackathon --from-literal=DB_PASSWORD='<rotated password>'
apiVersion: v1
kind: Secret
metadata:
  name: hackathon-db
  namespace: hackathon
type: Opaque
stringData:
  DB_PASSWORD: "<rotated password>"
